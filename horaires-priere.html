<style>
:root{--ink:#1d2b33;--bg:#f4f8fa;--card:#fff;--line:#dbe5ea;--brand:#0b4f6c;--muted:#5d6f78;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--ink:#e8f1f4;--bg:#0f1d24;--card:#172a33;--line:#2a4450;--brand:#5fb8d6;--muted:#9bb3bc;--err:#ff8a80}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
body{display:grid;place-items:center;min-height:100vh;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
main{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
h1{margin:0 0 6px;font-size:1.25rem}
p{margin:0 0 16px;color:var(--muted);font-size:.95rem}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
input[type=password],input[type=text]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;align-items:center;gap:8px;margin:12px 0 16px;font-size:.9rem;color:var(--muted)}
button{width:100%;padding:12px;border:0;border-radius:12px;background:var(--brand);color:#fff;font:inherit;font-weight:700;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#0f1d24}}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
#err{min-height:1.3em;margin:10px 0 0;color:var(--err);font-size:.9rem}
</style>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.data));
  const html=new TextDecoder().decode(buf);
  document.open();document.write(html);document.close();
}
const f=document.getElementById("f"),err=document.getElementById("err"),go=document.getElementById("go");
f.addEventListener("submit",async e=>{
  e.preventDefault();err.textContent="";go.disabled=true;
  const pw=document.getElementById("pw").value.trim();
  try{
    await open(pw);
    try{ localStorage.setItem("hp_pw",pw) }catch(_){}
  }catch(_){
    err.textContent="Mot de passe incorrect. Vérifiez le message reçu après l'achat.";
    go.disabled=false;
  }
});
(async()=>{
  let saved=null;try{saved=localStorage.getItem("hp_pw")}catch(_){}
  if(saved){try{await open(saved)}catch(_){try{localStorage.removeItem("hp_pw")}catch(__){}}}
})();
})();
</script>
